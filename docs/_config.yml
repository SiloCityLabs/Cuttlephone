title: Cuttlephone
tagline: 3D printable phone cases
description: "3D printable phone cases with Joy-Con and Razer Junglecat rails. Download free 3D models or build your own with OpenSCAD generator"
url: https://cuttlephone.com
logo: /images/website-logo.png
# Default Open Graph / Twitter preview image for all pages
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og-image.png
        width: 1220
        height: 811
        alt: Cuttlephone 3D printable phone case with controller rails
baseurl: 
repository: SiloCityLabs/Cuttlephone
guide_url: /guides/
generator_guide_url: /generator-guide/
github:
  repository_url: https://github.com/SiloCityLabs/Cuttlephone
# generated-models links
release_download_url: https://github.com/SiloCityLabs/Cuttlephone/releases/latest/download/
shop_url: https://shop.silocitylabs.com/collections/3d-prints/cuttlephone

# theme and theme configuration
# https://github.com/just-the-docs/just-the-docs
remote_theme: just-the-docs/just-the-docs@v0.12.0
#theme: just-the-docs
#color_scheme: "dark"
search_enabled: true
aux_links_new_tab: true
nav_external_links:
  - title: Code on Github
    url: https://github.com/SiloCityLabs/Cuttlephone
  - title: Shop
    url: https://shop.silocitylabs.com/collections/3d-prints/cuttlephone
callouts:
  warning:
    title: Warning
    color: red

sass:
  quiet_deps: true # hide SASS deprecation warnings from the remote theme
  sourcemap: never # only output the built CSS
  # style: compressed # breaks docs/assets/css/just-the-docs-head-nav.css

# need for block attributes: https://kramdown.gettalong.org/quickref.html#block-attributes
markdown: kramdown
kramdown:
  #input: GFM
  input: Kramdown
  syntax_highlighter: rouge

plugins:
- jekyll-default-layout
- jekyll-mentions
- jekyll-redirect-from
- jekyll-sitemap
- jemoji
- jekyll-remote-theme

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
