name: Deploy docs site

on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - .github/workflows/pages.yaml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# don't cancel a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Model list must match the published 3mf files, whatever commit was released
      - name: Phone case JSON from latest release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: could not resolve latest release tag" >&2
            exit 1
          fi
          echo "Using phone_case.json from ${TAG}"
          curl -fsSL -o docs/_data/phone_case.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/${TAG}/phone_case.json"

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: docs
          bundler-cache: true

      - name: Build site
        working-directory: docs
        env:
          # remote_theme fetches the theme via the GitHub API
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEKYLL_ENV: production
        run: bundle exec jekyll build --source . --destination _site

      - name: Verify build output
        run: |
          ls -lh docs/_site/
          if [ ! -f docs/_site/index.html ]; then
            echo "Error: docs/_site/index.html was not generated" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    # deploy from master branch, or from release events
    # other branches build as a check only
    if: github.ref == 'refs/heads/master' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
