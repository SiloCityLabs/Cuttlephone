name: Deploy docs site

on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - .github/workflows/pages.yaml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# don't cancel a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Models live on GitHub Releases (not in the repo). Pin docs to that release.
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: could not resolve latest release tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using release ${TAG}"

      - name: Phone case JSON from release tag
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          echo "Fetching phone_case.json from ${TAG}"
          curl -fsSL -o docs/_data/phone_case.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/${TAG}/phone_case.json"

      - name: Download 3MF assets from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          mkdir -p docs/assets/3mf
          gh release download "${TAG}" \
            --repo "${{ github.repository }}" \
            --dir docs/assets/3mf \
            --pattern '*.3mf'
          count=$(find docs/assets/3mf -type f -name '*.3mf' | wc -l)
          echo "Downloaded ${count} 3mf files from ${TAG}"
          ls -lh docs/assets/3mf | head -n 30
          if [ "${count}" -lt 1 ]; then
            echo "Error: no .3mf assets downloaded from release ${TAG}" >&2
            exit 1
          fi

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: docs
          bundler-cache: true

      - name: Build site
        working-directory: docs
        env:
          # remote_theme fetches the theme via the GitHub API
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEKYLL_ENV: production
        run: bundle exec jekyll build --source . --destination _site

      - name: Verify build output
        run: |
          ls -lh docs/_site/
          if [ ! -f docs/_site/index.html ]; then
            echo "Error: docs/_site/index.html was not generated" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    # deploy from master branch, or from release events
    # other branches build as a check only
    if: github.ref == 'refs/heads/master' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
