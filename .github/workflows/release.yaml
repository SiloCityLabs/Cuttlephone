name: Release phone case models

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional build workflow run ID (leave blank for latest successful build)"
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Find latest successful build
        if: ${{ github.event.inputs.run_id == '' }}
        id: latest_run
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build.yaml",
              branch: "main",
              status: "completed",
              per_page: 20
            });

            // Prefer runs that uploaded the full phone-case-models artifact
            // (skips single_build test runs which use phone-case-models-test)
            let selected = null;
            for (const candidate of runs.data.workflow_runs) {
              if (candidate.conclusion !== "success") continue;
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidate.id,
                per_page: 20
              });
              const hasFull = arts.data.artifacts.some(
                a => a.name === "phone-case-models" && !a.expired
              );
              if (hasFull) {
                selected = candidate;
                break;
              }
            }

            if (!selected) {
              core.setFailed("No successful full build workflow found.");
              return;
            }

            core.info(`Using workflow run ${selected.id}`);
            core.setOutput("run_id", selected.id);

      - name: Select run ID
        id: run
        run: |
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            echo "run_id=${{ github.event.inputs.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ steps.latest_run.outputs.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download model artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: phone-case-models
          path: build/

      - name: Extract version from build.sh
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version="\(.*\)"/\1/p' build.sh | head -n1 | tr -d ' ')
          if [ -z "$VERSION" ]; then
            echo "Error: could not extract version from build.sh" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify downloaded files
        run: ls -lh build/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/*.3mf
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Cuttlephone ${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: true
