name: Build phone case models

on:
  push:
    branches:
      - master
    paths:
      - build.sh
      - test_build.sh
      - phone_case.scad
      - phone_case.json
      - fonts/**
      - libraries/**
      - logos/**
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - build.sh
      - test_build.sh
      - phone_case.scad
      - phone_case.json
      - fonts/**
      - libraries/**
      - logos/**
      - .github/workflows/build.yaml
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full build.sh (needed for releases). Untick for lightweight test_build.sh only."
        required: false
        type: boolean
        default: true

# Cancel superseded CI runs on the same PR/branch.
# Manual full builds get a unique group so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Pin snapshot so CI is reproducible; bump deliberately when upgrading.
  OPENSCAD_VERSION: "2026.10.18"
  OPENSCAD_APPIMAGE: "OpenSCAD-2026.10.18-x86_64.AppImage"
  OPENSCAD_DIR: ${{ github.workspace }}/.openscad

jobs:
  build:
    runs-on: ubuntu-26.04
    # Full builds can take several minutes; test builds should finish in seconds.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build && 360 || 60 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            xvfb \
            libegl1 \
            libopengl0 \
            libxkbcommon0 \
            libglu1-mesa

      - name: Cache OpenSCAD
        id: openscad-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.OPENSCAD_DIR }}
          key: openscad-${{ env.OPENSCAD_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenSCAD
        if: steps.openscad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$OPENSCAD_DIR"
          curl -L "https://files.openscad.org/snapshots/${OPENSCAD_APPIMAGE}" \
            -o /tmp/openscad.AppImage
          chmod +x /tmp/openscad.AppImage
          # Extract instead of FUSE mount; more reliable on GitHub runners
          cd /tmp
          ./openscad.AppImage --appimage-extract
          mv squashfs-root "$OPENSCAD_DIR/squashfs-root"

      - name: Link OpenSCAD
        run: |
          set -euo pipefail
          cat <<EOF | sudo tee /usr/local/bin/openscad >/dev/null
          #!/usr/bin/env bash
          set -euo pipefail
          export APPDIR="${OPENSCAD_DIR}/squashfs-root"
          exec "\$APPDIR/AppRun" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/openscad
          openscad --version

      - name: Build models
        env:
          # PRs and pushes always use the lightweight test build.
          # Manual runs default to full build for release artifacts.
          FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        run: |
          if [ "$FULL_BUILD" = "true" ]; then
            chmod +x build.sh
            xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" ./build.sh
          else
            chmod +x test_build.sh
            xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" ./test_build.sh
          fi

      - name: Verify build outputs
        run: |
          ls -lh build/
          count=$(find build -type f -name '*.3mf' | wc -l)
          echo "Built ${count} models"
          if [ "$count" -lt 1 ]; then
            echo "Error: no .3mf files produced" >&2
            exit 1
          fi

      - name: Upload model artifacts
        uses: actions/upload-artifact@v7
        with:
          # Release workflow consumes phone-case-models only (full builds).
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build && 'phone-case-models' || 'phone-case-models-test' }}
          path: build/
          retention-days: 7
